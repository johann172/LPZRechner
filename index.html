<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LPZ Live-Rechner</title>
<style>
  :root {
    --accent: #1f6f43;
    --accent-dark: #164f30;
    --bg: #f4f6f5;
    --card: #ffffff;
    --border: #dfe5e2;
    --text: #1c2622;
    --muted: #6b7a73;
    --win: #1f8a4c;
    --loss: #c23b3b;
    --touch-size: 48px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 12px;
    padding-bottom: 40px;
  }
  .wrap { max-width: 600px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 8px 0 4px 0; text-align: center; }
  .sub { color: var(--muted); margin-bottom: 16px; font-size: 0.88rem; text-align: center; }
  
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }
  .card h2 {
    font-size: 1.05rem;
    margin: 0 0 12px 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .step-badge {
    background: var(--accent);
    color: white;
    width: 28px; height: 28px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: bold;
    flex-shrink: 0;
  }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; font-weight: 500; }
  input[type="text"], textarea, select {
    width: 100%;
    height: var(--touch-size);
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 1rem;
    background: #fff;
    color: var(--text);
    appearance: none;
    -webkit-appearance: none;
  }
  textarea { height: 100px; padding: 10px; font-family: monospace; font-size: 0.8rem; }
  .select-wrapper { position: relative; }
  .select-wrapper::after {
    content: "▼";
    font-size: 0.75rem;
    color: var(--muted);
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
  }
  .row { display: flex; flex-direction: column; gap: 10px; }
  
  button {
    background: var(--accent);
    color: white;
    border: none;
    height: var(--touch-size);
    padding: 0 20px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 600;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s;
  }
  button:active { background: var(--accent-dark); }
  button.secondary {
    background: #fff;
    color: var(--accent-dark);
    border: 1.5px solid var(--accent);
  }
  button.danger {
    background: #fff;
    color: var(--loss);
    border: 1.5px solid var(--loss);
  }
  button:disabled { background: #b7c1bc; cursor: not-allowed; }
  
  .pill {
    display: inline-block;
    background: #eaf3ee;
    color: var(--accent-dark);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 1rem;
    font-weight: bold;
  }
  .msg { font-size: 0.85rem; margin-top: 10px; text-align: center; }
  .msg.error { color: var(--loss); }
  .msg.ok { color: var(--accent-dark); }
  
  .flags { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }
  .flags label {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.9rem;
    color: var(--text);
    background: #f8faf9;
    padding: 10px 12px;
    border-radius: 8px;
    margin: 0;
    cursor: pointer;
  }
  .flags input[type="checkbox"] {
    width: 22px;
    height: 22px;
    accent-color: var(--accent);
  }
  
  .roster-list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .roster-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px;
    background: #f8faf9;
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .roster-info { font-weight: 600; font-size: 0.95rem; }
  .roster-sub { font-size: 0.8rem; color: var(--muted); font-weight: normal; }
  .roster-actions { display: flex; gap: 8px; align-items: center; }
  .roster-actions select { height: 38px; width: 110px; font-size: 0.88rem; }
  .roster-actions button { height: 38px; width: 44px; padding: 0; font-size: 1.2rem; }

  .match-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 8px;
  }
  .remove-btn {
    background: none; border: none; color: var(--loss); font-size: 1.3rem;
    cursor: pointer; padding: 0 8px; height: auto; width: auto;
  }

  .result-box {
    background: #eaf3ee;
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    margin-top: 16px;
  }
  .result-box .big { font-size: 2.4rem; font-weight: 800; color: var(--accent-dark); }
  .result-box .delta { font-size: 1.2rem; font-weight: 700; margin-top: 4px; }
  .delta-plus { color: var(--win); }
  .delta-minus { color: var(--loss); }

  .fav-bar {
    display: flex;
    gap: 8px;
    margin-top: 8px;
  }
  .fav-bar button {
    height: 38px;
    font-size: 0.85rem;
  }

  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🏓 LPZ Live-Rechner</h1>
  <div class="sub">Mobil-optimiert für Mannschaftskämpfe</div>

  <!-- Schritt 1 -->
  <div class="card">
    <h2><span class="step-badge">1</span> Mein Spieler / Team laden</h2>

    <label>⭐ Favoriten-Spieler</label>
    <div id="favPlayersList" class="roster-list"></div>
    <div class="row" style="margin-top: 8px;">
      <input type="text" id="favPlayerLabel" placeholder="Name (z. B. Franz Hoppe)">
      <input type="text" id="favPlayerUrl" placeholder="Link zur Spieler-Seite (...L3=Spieler&L3P=...)">
      <button id="addFavPlayerBtn" class="secondary">+ Spieler als Favorit speichern</button>
    </div>
    <div id="favPlayerMsg" class="msg"></div>

    <div id="favPlayerTeamsBox" class="hidden" style="margin-top: 14px; border-top: 1px dashed var(--border); padding-top: 12px;">
      <label id="favPlayerTeamsLabel">Für welche Mannschaft?</label>
      <div class="select-wrapper" style="margin-bottom: 10px;">
        <select id="favPlayerTeamsSelect"></select>
      </div>
      <button id="useFavPlayerTeamBtn">Diese Mannschaft laden</button>
    </div>

    <label for="teamUrl" style="margin-top: 18px; border-top: 1px dashed var(--border); padding-top: 12px;">Oder: Link direkt zu einer Team-Seite eingeben</label>
    <div class="row">
      <input type="text" id="teamUrl" placeholder="https://app.web4sport.de/?L1=Ergebnisse&...">
      <button id="loadTeamBtn">Team-Daten laden</button>
    </div>
    
    <div class="fav-bar">
      <button id="saveFavBtn" class="secondary">★ Als Standard-Team speichern</button>
      <button id="clearFavBtn" class="danger hidden">Standard-Team löschen</button>
    </div>

    <div id="teamMsg" class="msg"></div>

    <div id="manualFallback" class="hidden" style="margin-top:14px; border-top:1px dashed var(--border); padding-top:12px;">
      <label for="manualHtml">HTML-Quelltext hier einfügen (Notfall-Modus):</label>
      <textarea id="manualHtml" placeholder="Quelltext der web4sport-Seite hier hineinkopieren..."></textarea>
      <button id="parseManualBtn" style="margin-top:8px;" class="secondary">Quelltext verarbeiten</button>
    </div>

    <div id="myPlayerBlock" class="hidden" style="margin-top:16px;">
      <label for="myPlayerSelect">Mein Spieler</label>
      <div class="select-wrapper">
        <select id="myPlayerSelect"></select>
      </div>
      <div style="margin-top: 12px; display: flex; align-items: center; justify-content: space-between;">
        <span style="font-size: 0.9rem; color: var(--muted);">Start LPZ:</span>
        <div class="pill" id="myPlayerPz">–</div>
      </div>

      <label style="margin-top:16px;">K-Faktor Anpassung (Optional)</label>
      <div class="flags">
        <label><input type="checkbox" id="flagU21"> Jünger als 21 Jahre (+4)</label>
        <label><input type="checkbox" id="flagU16"> Zusätzlich jünger als 16 (+4)</label>
        <label><input type="checkbox" id="flagInactive"> &gt;365 Tage inaktiv (+4)</label>
        <label><input type="checkbox" id="flagFewGames"> &lt;30 gewertete Einzel (+4)</label>
      </div>
    </div>
  </div>

  <!-- Schritt 2 -->
  <div class="card hidden" id="opponentCard">
    <h2><span class="step-badge">2</span> Gegner-Team wählen</h2>
    <label for="opponentTeamSelect">Gegnerische Mannschaft</label>
    <div class="select-wrapper" style="margin-bottom:10px;">
      <select id="opponentTeamSelect"></select>
    </div>
    <button id="loadOpponentBtn" class="secondary">Kader laden</button>
    <div id="opponentMsg" class="msg"></div>

    <div id="oppManualFallback" class="hidden" style="margin-top:14px; border-top:1px dashed var(--border); padding-top:12px;">
      <label for="oppManualHtml">HTML-Quelltext der Gegner-Seite einfügen:</label>
      <textarea id="oppManualHtml" placeholder="Quelltext der Gegner-Seite hier hineinkopieren..."></textarea>
      <button id="parseOppManualBtn" style="margin-top:8px;" class="secondary">Gegner-Quelltext verarbeiten</button>
    </div>

    <div id="opponentRosterList" class="roster-list hidden"></div>
  </div>

  <!-- Schritt 3 -->
  <div class="card hidden" id="matchesCard">
    <h2><span class="step-badge">3</span> Erfasste Einzel</h2>
    <div id="matchesList"></div>
    <div id="noMatchesMsg" style="font-size: 0.85rem; color: var(--muted); text-align: center; padding: 12px;">Noch kein Einzel hinzugefügt.</div>
    <div style="margin-top: 14px;">
      <button id="calcBtn">Neue LPZ berechnen</button>
    </div>
  </div>

  <!-- Ergebnis -->
  <div class="card hidden" id="resultCard">
    <h2><span class="step-badge">✓</span> Berechnung</h2>
    <div id="resultList" class="roster-list"></div>
    <div class="result-box">
      <div style="font-size: 0.9rem; color: var(--muted);">Prognostizierte neue LPZ</div>
      <div class="big" id="resultNewPz">–</div>
      <div class="delta" id="resultDelta">–</div>
    </div>
  </div>
</div>

<script>
const MY_CLOUDFLARE_WORKER = "https://lpz-proxy.johann172.workers.dev"; 

let myPlayer = null;
let matches = [];
let currentOpponentRoster = [];
let currentBaseUrl = "https://app.web4sport.de/";

const $ = (id) => document.getElementById(id);

function setMsg(el, text, ok) {
  el.textContent = text || "";
  el.className = "msg " + (ok ? "ok" : "error");
}

function parseHTML(htmlText) {
  const parser = new DOMParser();
  return parser.parseFromString(htmlText, 'text/html');
}

function extractRoster(doc) {
  const players = [];
  const seenNames = new Set();

  // Primäre Methode: Die Seite markiert die LivePZ-Zelle zuverlässig mit
  // einem title-Attribut wie "LivePZ-Wert vom 12.09.2026". Wir suchen in
  // jeder Tabellenzeile nach dieser Zelle + einem Spieler-Link
  // (a[href*="L3=Spieler"]) in derselben Zeile.
  doc.querySelectorAll('tr').forEach(row => {
    const nameLink = row.querySelector('a[href*="L3=Spieler"]');
    const pzCell = row.querySelector('td[title*="LivePZ"]');
    if (!nameLink || !pzCell) return;

    const name = nameLink.textContent.trim();
    const pzText = pzCell.textContent.trim();
    if (!name || !/^\d{2,4}$/.test(pzText)) return;

    const pz = parseInt(pzText, 10);
    if (pz < 200 || pz > 3000) return;
    if (seenNames.has(name)) return;

    seenNames.add(name);
    players.push({ name, livepz: pz });
  });

  if (players.length > 0) return players;

  // Fallback (Notfall-Modus): grobe Heuristik, falls das title-Attribut
  // auf einer Seite einmal fehlen sollte.
  const tables = Array.from(doc.querySelectorAll('table'));
  let targetTable = null;

  for (const table of tables) {
    const txt = table.textContent;
    if ((txt.includes('LivePZ') || txt.includes('LPZ') || txt.includes('PZ')) &&
        (txt.includes('Spieler') || txt.includes('Position') || txt.includes('Bilanzen'))) {
      targetTable = table;
      break;
    }
  }

  const scope = targetTable || doc.body;

  const rows = scope.querySelectorAll('tr');
  rows.forEach(row => {
    const cells = Array.from(row.querySelectorAll('td, th')).map(c => c.textContent.trim());
    if (cells.length < 2) return;

    const fullRowText = cells.join(' ');
    if (fullRowText.length > 120 || fullRowText.includes('Position') || fullRowText.includes('Bilanzen')) return;

    let name = "";
    let pz = null;

    cells.forEach(cell => {
      if (/^\d{3,4}$/.test(cell)) {
        const val = parseInt(cell, 10);
        if (val >= 500 && val <= 3000) pz = val;
      }
      if (/[a-zA-ZäöüÄÖÜß]{2,}/.test(cell) && 
          !cell.includes('LivePZ') && !cell.includes('Gesamt') && !cell.includes('ST') &&
          cell.length < 40) {
        let clean = cell.replace(/^\d+\.\s*/, '').replace(/(NES|S|N|E)?\d*$/, '').trim();
        if (clean.length >= 3) name = clean;
      }
    });

    if (name && pz && !seenNames.has(name)) {
      seenNames.add(name);
      players.push({ name, livepz: pz });
    }
  });

  if (players.length === 0 && targetTable) {
    const text = targetTable.textContent;
    const regex = /(\d{1,2})\.\s*([A-Za-zÄÖÜäöüß\s\-\.]+?)(?:NES|S|N|E)?\d*\s*(?:[\d\:]+\s*)?(\d{3,4})(?=\s|\d+\.|$)/g;
    let m;
    while ((m = regex.exec(text)) !== null) {
      let rawName = m[2].trim();
      let pz = parseInt(m[3], 10);
      
      rawName = rawName.replace(/^(Einzel|Bilanzen|Position|Spieler|Kennzeichnung|ST|PK\d|Gesamt|LivePZ)+/gi, '').trim();
      rawName = rawName.replace(/\d+$/, '').trim();

      if (rawName.length >= 3 && pz >= 500 && pz <= 3000 && !seenNames.has(rawName)) {
        seenNames.add(rawName);
        players.push({ name: rawName, livepz: pz });
      }
    }
  }

  return players;
}

function extractTeams(doc, baseUrl) {
  const teams = [];
  const seen = new Set();

  const ignoreWords = [
    'spielplan', 'vorrunde', 'rückrunde', 'vorbericht', 'bericht',
    'tabelle', 'bilanzen', 'ergebnisse', 'gesamt', 'einzel', 'doppel',
    'mannschaften', 'übersicht', 'zurück', 'archiv', 'drucken', 'aufstellung'
  ];

  const links = doc.querySelectorAll('a[href*="L3P="], a[href*="L3=Mannschaften"]');

  links.forEach(a => {
    const href = a.getAttribute('href');
    const name = a.textContent.trim();
    const lowerName = name.toLowerCase();

    if (!href || !name) return;

    if (ignoreWords.some(word => lowerName.includes(word))) return;
    if (/^\d+:\d+$/.test(name)) return;
    if (!href.includes('Mannschaften')) return;

    const match = href.match(/L3P=(\d+)/);
    if (match && !seen.has(match[1])) {
      seen.add(match[1]);
      try {
        const fullUrl = new URL(href, baseUrl).href;
        teams.push({ name, url: fullUrl });
      } catch (e) {}
    }
  });

  return teams;
}

// Liest die "Bilanz"-Tabelle einer Spieler-Seite aus (siehe Screenshot: Mannschaft | Kennzeichnung | ST | PK1-4 | Gesamt | LivePZ)
// und liefert alle Mannschaften, für die dieser Spieler gemeldet ist.
// Sucht direkt nach Zeilen mit einem Mannschafts-Link (a[href*="L3=Mannschaften"]);
// die LivePZ-Zelle in derselben Zeile erkennt man zuverlässig am title-Attribut
// "LivePZ-Wert vom ...". Diese Zelle fehlt bei Mannschaften, in denen der
// Spieler noch kein Spiel gemacht hat - dann bleibt livepz einfach null.
function extractPlayerBilanz(doc, baseUrl) {
  const teams = [];
  const seen = new Set();
  let overallPz = null;

  doc.querySelectorAll('tr').forEach(row => {
    const link = row.querySelector('a[href*="L3=Mannschaften"]');
    if (!link) return;
    const teamName = link.textContent.trim();
    const href = link.getAttribute('href');
    if (!teamName || !href) return;

    let teamUrl;
    try { teamUrl = new URL(href, baseUrl).href; } catch (e) { return; }
    if (seen.has(teamUrl)) return;

    let pz = null;
    const pzCell = row.querySelector('td[title*="LivePZ"]');
    if (pzCell) {
      const t = pzCell.textContent.trim();
      if (/^\d{2,4}$/.test(t)) {
        const v = parseInt(t, 10);
        if (v >= 200 && v <= 3000) pz = v;
      }
    }
    if (pz) overallPz = pz;

    seen.add(teamUrl);
    teams.push({ name: teamName, url: teamUrl, livepz: pz });
  });

  return { teams, livepz: overallPz };
}

async function fetchPage(url) {
  const proxyUrl = `${MY_CLOUDFLARE_WORKER}/?url=${encodeURIComponent(url)}`;
  let res;
  try {
    res = await fetch(proxyUrl);
  } catch (networkErr) {
    throw new Error(`Proxy nicht erreichbar (${MY_CLOUDFLARE_WORKER}): ${networkErr.message}`);
  }
  if (!res.ok) {
    let bodyText = "";
    try { bodyText = (await res.text()).slice(0, 200); } catch (e) {}
    throw new Error(`Proxy antwortete mit Status ${res.status} ${res.statusText}${bodyText ? " – " + bodyText : ""}`);
  }
  const htmlText = await res.text();
  if (!htmlText || htmlText.trim().length < 50) {
    throw new Error("Proxy lieferte eine leere/zu kurze Antwort.");
  }
  return parseHTML(htmlText);
}

function processDocument(doc, preferredPlayerName) {
  const players = extractRoster(doc);
  const teams = extractTeams(doc, currentBaseUrl);

  if (!players.length) {
    throw new Error("Keine Spieler/LivePZ in den Daten gefunden.");
  }

  setMsg($("teamMsg"), `${players.length} Spieler geladen!`, true);

  const sel = $("myPlayerSelect");
  sel.innerHTML = "";
  players.forEach((p, idx) => {
    const opt = document.createElement("option");
    opt.value = idx;
    opt.textContent = `${p.name} (${p.livepz})`;
    sel.appendChild(opt);
  });

  // Falls ein Favoriten-Spieler gewählt wurde: passenden Eintrag im geladenen
  // Team-Kader vorauswählen (Namensabgleich), statt einfach den ersten zu nehmen.
  let startIdx = 0;
  if (preferredPlayerName) {
    const norm = (s) => s.toLowerCase().replace(/[^a-zäöüß\s]/g, "").trim();
    const target = norm(preferredPlayerName);
    const foundIdx = players.findIndex(p => norm(p.name) === target || norm(p.name).includes(target) || target.includes(norm(p.name)));
    if (foundIdx >= 0) startIdx = foundIdx;
  }
  sel.value = startIdx;
  myPlayer = players[startIdx];
  $("myPlayerPz").textContent = myPlayer.livepz;
  $("myPlayerBlock").classList.remove("hidden");

  sel.onchange = () => {
    myPlayer = players[sel.value];
    $("myPlayerPz").textContent = myPlayer.livepz;
  };

  const oppSel = $("opponentTeamSelect");
  oppSel.innerHTML = "";
  teams.forEach(t => {
    const opt = document.createElement("option");
    opt.value = t.url;
    opt.textContent = t.name;
    oppSel.appendChild(opt);
  });

  $("opponentCard").classList.remove("hidden");
  $("matchesCard").classList.remove("hidden");
  $("manualFallback").classList.add("hidden");
}

async function loadTeamDataFromUrl(url, preferredPlayerName) {
  if (!url) { setMsg($("teamMsg"), "Bitte Link eingeben.", false); return; }
  $("teamUrl").value = url;
  currentBaseUrl = url;
  setMsg($("teamMsg"), "Lade Daten...", true);
  $("loadTeamBtn").disabled = true;

  try {
    const doc = await fetchPage(url);
    processDocument(doc, preferredPlayerName);
  } catch (e) {
    setMsg($("teamMsg"), "Automatisches Laden fehlgeschlagen (" + e.message + "). Du kannst den Quelltext unten manuell einfügen.", false);
    $("manualFallback").classList.remove("hidden");
  } finally {
    $("loadTeamBtn").disabled = false;
  }
}

function loadTeamData() {
  return loadTeamDataFromUrl($("teamUrl").value.trim());
}

$("loadTeamBtn").addEventListener("click", loadTeamData);

// ---------- Favoriten-Spieler ----------
function getFavPlayers() {
  try { return JSON.parse(localStorage.getItem("favPlayers") || "[]"); }
  catch (e) { return []; }
}
function setFavPlayers(list) {
  localStorage.setItem("favPlayers", JSON.stringify(list));
}

function renderFavPlayers() {
  const list = $("favPlayersList");
  const favs = getFavPlayers();
  list.innerHTML = "";
  if (!favs.length) {
    list.classList.add("hidden");
    return;
  }
  list.classList.remove("hidden");
  favs.forEach((fav, idx) => {
    const item = document.createElement("div");
    item.className = "roster-item";
    item.innerHTML = `
      <div class="roster-info" style="cursor:pointer;">${fav.label}</div>
      <div class="roster-actions">
        <button class="select-fav-btn secondary" style="width:auto; padding:0 10px;">Wählen</button>
        <button class="remove-btn">✕</button>
      </div>
    `;
    item.querySelector(".select-fav-btn").addEventListener("click", () => selectFavPlayer(fav));
    item.querySelector(".roster-info").addEventListener("click", () => selectFavPlayer(fav));
    item.querySelector(".remove-btn").addEventListener("click", () => {
      const updated = getFavPlayers().filter((_, i) => i !== idx);
      setFavPlayers(updated);
      renderFavPlayers();
    });
    list.appendChild(item);
  });
}

$("addFavPlayerBtn").addEventListener("click", () => {
  const label = $("favPlayerLabel").value.trim();
  const url = $("favPlayerUrl").value.trim();
  if (!label || !url) {
    setMsg($("favPlayerMsg"), "Bitte Name und Spieler-Link angeben.", false);
    return;
  }
  const favs = getFavPlayers();
  favs.push({ label, url });
  setFavPlayers(favs);
  $("favPlayerLabel").value = "";
  $("favPlayerUrl").value = "";
  setMsg($("favPlayerMsg"), `"${label}" als Favorit gespeichert.`, true);
  renderFavPlayers();
});

let favPlayerTeams = [];
let favPlayerActiveLabel = null;

async function selectFavPlayer(fav) {
  setMsg($("favPlayerMsg"), `Lade Mannschaften von ${fav.label} …`, true);
  favPlayerActiveLabel = fav.label;
  try {
    const doc = await fetchPage(fav.url);
    const { teams } = extractPlayerBilanz(doc, fav.url);
    if (!teams.length) {
      setMsg($("favPlayerMsg"), "Keine Mannschaften in der Bilanz-Tabelle gefunden. Ist der Link eine Spieler-Seite (...L3=Spieler&L3P=...)?", false);
      return;
    }
    favPlayerTeams = teams;
    const sel = $("favPlayerTeamsSelect");
    sel.innerHTML = "";
    teams.forEach((t, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.textContent = t.livepz ? `${t.name} (LivePZ ${t.livepz})` : t.name;
      sel.appendChild(opt);
    });
    $("favPlayerTeamsLabel").textContent = `${fav.label} – für welche Mannschaft?`;
    $("favPlayerTeamsBox").classList.remove("hidden");
    setMsg($("favPlayerMsg"), `${teams.length} Mannschaft(en) gefunden.`, true);
    $("favPlayerTeamsBox").scrollIntoView({ behavior: "smooth", block: "nearest" });
  } catch (e) {
    setMsg($("favPlayerMsg"), "Spieler-Seite konnte nicht geladen werden: " + e.message, false);
  }
}

$("useFavPlayerTeamBtn").addEventListener("click", () => {
  const idx = parseInt($("favPlayerTeamsSelect").value, 10);
  const team = favPlayerTeams[idx];
  if (!team) return;
  loadTeamDataFromUrl(team.url, favPlayerActiveLabel);
});

// Favoriten-Logik
$("saveFavBtn").addEventListener("click", () => {
  const url = $("teamUrl").value.trim();
  if (!url) {
    setMsg($("teamMsg"), "Bitte zuerst einen Link eingeben.", false);
    return;
  }
  localStorage.setItem("favTeamUrl", url);
  $("clearFavBtn").classList.remove("hidden");
  setMsg($("teamMsg"), "★ Team als Favorit gespeichert!", true);
});

$("clearFavBtn").addEventListener("click", () => {
  localStorage.removeItem("favTeamUrl");
  $("clearFavBtn").classList.add("hidden");
  setMsg($("teamMsg"), "Favorit gelöscht.", true);
});

// Automatisches Laden des Favoriten beim Öffnen der Seite
window.addEventListener("DOMContentLoaded", () => {
  renderFavPlayers();
  const savedUrl = localStorage.getItem("favTeamUrl");
  if (savedUrl) {
    $("teamUrl").value = savedUrl;
    $("clearFavBtn").classList.remove("hidden");
    loadTeamData();
  }
});

$("parseManualBtn").addEventListener("click", () => {
  const htmlText = $("manualHtml").value.trim();
  if (!htmlText) return;
  try {
    const doc = parseHTML(htmlText);
    processDocument(doc);
  } catch (e) {
    setMsg($("teamMsg"), e.message, false);
  }
});

$("loadOpponentBtn").addEventListener("click", async () => {
  const url = $("opponentTeamSelect").value;
  if (!url) return;
  setMsg($("opponentMsg"), "Lade Gegner-Kader...", true);
  $("loadOpponentBtn").disabled = true;
  $("oppManualFallback").classList.add("hidden");

  try {
    const doc = await fetchPage(url);
    currentOpponentRoster = extractRoster(doc);
    if (!currentOpponentRoster.length) throw new Error("Keine Spieler gefunden.");
    setMsg($("opponentMsg"), `${currentOpponentRoster.length} Gegner gefunden.`, true);
    renderOpponentRoster();
  } catch (e) {
    setMsg($("opponentMsg"), "Laden fehlgeschlagen. Bitte Quelltext der Gegnerseite unten einfügen.", false);
    $("oppManualFallback").classList.remove("hidden");
  } finally {
    $("loadOpponentBtn").disabled = false;
  }
});

$("parseOppManualBtn").addEventListener("click", () => {
  const htmlText = $("oppManualHtml").value.trim();
  if (!htmlText) return;
  try {
    const doc = parseHTML(htmlText);
    currentOpponentRoster = extractRoster(doc);
    if (!currentOpponentRoster.length) throw new Error("Keine Spieler im Quelltext gefunden.");
    setMsg($("opponentMsg"), `${currentOpponentRoster.length} Gegner geladen!`, true);
    renderOpponentRoster();
    $("oppManualFallback").classList.add("hidden");
  } catch (e) {
    setMsg($("opponentMsg"), e.message, false);
  }
});

function renderOpponentRoster() {
  const list = $("opponentRosterList");
  list.innerHTML = "";
  currentOpponentRoster.forEach(p => {
    const item = document.createElement("div");
    item.className = "roster-item";
    item.innerHTML = `
      <div>
        <div class="roster-info">${p.name}</div>
        <div class="roster-sub">LPZ: ${p.livepz}</div>
      </div>
      <div class="roster-actions">
        <div class="select-wrapper">
          <select class="res-sel">
            <option value="win">Sieg</option>
            <option value="loss">Niederlage</option>
          </select>
        </div>
        <button class="add-btn">+</button>
      </div>
    `;
    item.querySelector(".add-btn").addEventListener("click", () => {
      const win = item.querySelector(".res-sel").value === "win";
      matches.push({ name: p.name, livepz: p.livepz, win });
      renderMatches();
    });
    list.appendChild(item);
  });
  list.classList.remove("hidden");
}

function renderMatches() {
  const container = $("matchesList");
  container.innerHTML = "";
  matches.forEach((m, idx) => {
    const item = document.createElement("div");
    item.className = "match-item";
    item.innerHTML = `
      <div>
        <div style="font-weight:600;">${m.name} (${m.livepz})</div>
        <div style="font-size:0.85rem; color:${m.win ? 'var(--win)' : 'var(--loss)'}; font-weight:bold;">
          ${m.win ? 'Sieg' : 'Niederlage'}
        </div>
      </div>
      <button class="remove-btn">✕</button>
    `;
    item.querySelector(".remove-btn").addEventListener("click", () => {
      matches.splice(idx, 1);
      renderMatches();
    });
    container.appendChild(item);
  });
  $("noMatchesMsg").classList.toggle("hidden", matches.length > 0);
}

$("calcBtn").addEventListener("click", () => {
  if (!myPlayer || !matches.length) return;

  let extraK = 0;
  if ($("flagU21").checked) extraK += 4;
  if ($("flagU16").checked) extraK += 4;
  if ($("flagInactive").checked) extraK += 4;
  if ($("flagFewGames").checked) extraK += 4;
  const k = Math.min(16 + extraK, 32);

  let totalDelta = 0;
  const resContainer = $("resultList");
  resContainer.innerHTML = "";

  matches.forEach(m => {
    const ew = 1.0 / (1.0 + Math.pow(10, -(myPlayer.livepz - m.livepz) / 150));
    const rawDelta = m.win ? (1 - ew) * k : -ew * k;
    const delta = Math.round(rawDelta);
    totalDelta += delta;

    const item = document.createElement("div");
    item.className = "roster-item";
    const deltaClass = delta >= 0 ? "delta-plus" : "delta-minus";
    item.innerHTML = `
      <div>
        <div class="roster-info">${m.name} (${m.livepz})</div>
        <div class="roster-sub">Erwartung: ${(ew * 100).toFixed(1)}% | ${m.win ? 'Sieg' : 'Niederlage'}</div>
      </div>
      <div class="${deltaClass}" style="font-size:1.1rem;">
        ${delta >= 0 ? '+' : ''}${delta}
      </div>
    `;
    resContainer.appendChild(item);
  });

  const newPz = Math.round(myPlayer.livepz + totalDelta);
  $("resultNewPz").textContent = newPz;
  const totalClass = totalDelta >= 0 ? "delta-plus" : "delta-minus";
  $("resultDelta").innerHTML = `<span class="${totalClass}">${totalDelta >= 0 ? '+' : ''}${totalDelta} LPZ</span> (K-Faktor: ${k})`;

  $("resultCard").classList.remove("hidden");
  $("resultCard").scrollIntoView({ behavior: "smooth" });
});
</script>
</body>
